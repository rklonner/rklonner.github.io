<html>
<head>
<meta charset="utf-8">
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background-color: #0d1117; /* GitHub Dark Background */
    color: #c9d1d9;
    margin: 0;
    padding: 20px;
}
.container {
    margin: auto;
    width: 910px;
}
.diffs {
    margin: 20px 0 20px 0;
}
.diff_container {
    width: 910px;
    overflow-x: scroll;
    border-radius: 8px;
    background: #161b22; /* Dunklerer Container-Hintergrund */
    scrollbar-width: none;
    margin: 10px 0 10px 0;
    border: 1px solid #30363d;
}
table {
    font-family: monospace;
    border-spacing: 0px;
    width: 100%;
}
/* Zeilen-Logik exakt wie im Original, nur mit Dark-Farben */
tr.normal_line {
    background: #161b22;
}
tr.added_line {
    background: rgba(46, 160, 67, 0.15); /* GitHub Green */
    color: #3fb950;
}
tr.removed_line {
    background: rgba(248, 81, 73, 0.15); /* GitHub Red */
    color: #f85149;
}
tr.comment_line {
    background: #0d1117;
    color: #8b949e;
}
.resource_header {
    font-family: monospace;
    font-size: 14px;
    color: #8b949e;
    margin: 15px 0 5px 0;
    padding: 0;
}
.resource_header:first-of-type {
    margin-top: 10px;
}
pre {
    margin: 0;
    padding-left: 15px;
    padding-right: 15px;
    /* Verhindert, dass pre-Tags die Zeilenhöhe künstlich aufblähen */
    line-height: inherit; 
}
h1 {
    color: #f0f6fc;
}
summary {
    color: #58a6ff;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
<h1>Argo CD Diff Preview</h1>

<p>Summary:</p>
<pre>No changes found</pre>

<div class="diffs">
No changes found
</div>

<pre>_Stats_:
[Applications: 4], [Full Run: 1m36s], [Rendering: 21s], [Cluster: 12s], [Argo CD: 1m3s]</pre>
</div>
</body>
</html>
